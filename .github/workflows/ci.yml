name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries (PortAudio, Qt runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install spiny and the optional plugins
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" praat-parselmouth
          # NOTE: editable install, the packaged toolkit does not ship its prosody_tools subpackage
          pip install -e "git+https://github.com/asuni/wavelet_prosody_toolkit@a19fa7c87ff6cd2bb7072b673c8f20bf91aef6d7#egg=wavelet_prosody_toolkit"
      - name: Check the type hints
        run: mypy
      - name: Run the tests
        run: pytest -v
