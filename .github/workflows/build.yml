name: Standalone binaries

# Builds the standalone application (PyInstaller, see packaging/spiny.spec) on every supported platform,
# checks that each binary starts, and attaches the archives to a GitHub release when a v* tag is pushed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE: the oldest supported Ubuntu runner, so that the binary runs on older glibc versions too
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install spiny and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . praat-parselmouth pyinstaller

      - name: Build
        working-directory: packaging
        run: pyinstaller --noconfirm spiny.spec

      # The application quits by itself once the GUI is up (SPINY_AUTOQUIT_MS): a crash or a missing library fails the job
      - name: Check that the binary starts (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          SPINY_AUTOQUIT_MS: "3000"
        run: packaging/dist/spiny/spiny -w examples/arctic_a0002.wav -a examples/arctic_a0002.lab

      - name: Check that the binary starts (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          SPINY_AUTOQUIT_MS: "3000"
        run: packaging/dist/Sp1NY.app/Contents/MacOS/spiny -w examples/arctic_a0002.wav -a examples/arctic_a0002.lab

      - name: Check that the binary starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SPINY_AUTOQUIT_MS: "3000"
        run: |
          # NOTE: a GUI executable returns immediately when started from a shell, so wait for it explicitly
          $p = Start-Process -FilePath packaging\dist\spiny\spiny.exe `
            -ArgumentList "-w", "examples\arctic_a0002.wav", "-a", "examples\arctic_a0002.lab" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "spiny.exe exited with code $($p.ExitCode)" }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C packaging/dist -czf spiny-${{ matrix.name }}.tar.gz spiny

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: hdiutil create -volname Sp1NY -srcfolder packaging/dist/Sp1NY.app -ov -format UDZO spiny-${{ matrix.name }}.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path packaging\dist\spiny -DestinationPath spiny-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: spiny-${{ matrix.name }}
          path: spiny-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
