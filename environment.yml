# Cross-platform conda environment for Sp1NY
#   conda env create -f environment.yml && conda activate spiny
# The system libraries (Qt, PortAudio) come from conda-forge, the Python packages from pyproject.toml.
name: spiny
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - portaudio
  - pyside6
  - pip:
      - -e .
      - praat-parselmouth  # optional "Spectrogram (Praat)" plugin
      # The optional "Wavelet" plugin needs wavelet_prosody_toolkit, see the "plugins" extra in pyproject.toml
