[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "SpINY"
version = "0.1"
authors = [
  "Sébastien Le Maguer <lemagues@tcd.ie>",
  "Mark Anderson <andersm3@tcd.ie>"
]
description = "Speech vIsualisation and aNnotation in pYthon"
readme = "README.md"
license = "MIT"
classifiers = [
  'Development Status :: 3 - Alpha',
  # Audience
  'Intended Audience :: Science/Research',
  # Topics
  'Topic :: Multimedia :: Sound/Audio :: Speech',
  'Topic :: Scientific/Engineering :: Information Analysis',
  'Topic :: Scientific/Engineering :: Visualization',
  # Pick your license as you wish
  'License :: OSI Approved :: MIT License',
  # Python version
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.8',
  'Programming Language :: Python :: 3.9',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
]

[tool.poetry.dependencies]
# Python
python = ">=3.8, <3.13"
# QT/Plotting
matplotlib = "*"
pyqtgraph = ">=0.13.1"
PySide6 = "*"
# Audio
librosa = ">=0.10.0"
sounddevice = "*"
# Annotations
tgt = "*"
ipapy = "*"
# Plugins
praat-parselmouth = { version = "*", optional = true }
# NOTE: pinned to a commit for reproducibility (and to avoid pulling unreviewed upstream changes)
wavelet_prosody_toolkit = { git = "https://github.com/asuni/wavelet_prosody_toolkit", rev = "a19fa7c87ff6cd2bb7072b673c8f20bf91aef6d7", optional = true }
# Dev
pre-commit = { version = "*", optional = true }

[tool.poetry.scripts]
spiny = "spiny.main:main"

[tool.poetry.extras]
plugins = ["praat-parselmouth", "wavelet_prosody_toolkit"]
dev = ["pre-commit"]

[tool.poetry.urls]
"Homepage" = "https://github.com/sigmedia/sp1ny"
"Bug Tracker" = "https://github.com/sigmedia/sp1ny/issues"

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
  \.toml
  |\.sh
  |\.git
  |\.ini
  |Dockerfile
  |Jenkinfile
)/
'''
