<svg xmlns='http://www.w3.org/2000/svg' width='900' height='330' viewBox='0 0 900 330' role='img'><title>Chunked Praat analysis</title><rect width='900' height='330' fill='#fcfcfb'/><text x='24.0' y='30.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Praat spectrogram: analysis by chunks with margins</text><text x='60.0' y='64.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>signal</text><rect x='60.0' y='72.0' width='780.0' height='20.0' rx='3' fill='#e4e3de' stroke='#8f8e88' stroke-width='1.5'/><line x1='60.0' y1='68.0' x2='60.0' y2='96.0' stroke='#8f8e88' stroke-width='1.5'/><text x='190.0' y='87.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>chunk 0 (30 s)</text><line x1='320.0' y1='68.0' x2='320.0' y2='96.0' stroke='#8f8e88' stroke-width='1.5'/><text x='450.0' y='87.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>chunk 1 (30 s)</text><line x1='580.0' y1='68.0' x2='580.0' y2='96.0' stroke='#8f8e88' stroke-width='1.5'/><text x='710.0' y='87.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>chunk 2 (30 s)</text><line x1='840.0' y1='68.0' x2='840.0' y2='96.0' stroke='#8f8e88' stroke-width='1.5'/><rect x='292.0' y='120.0' width='316.0' height='24.0' rx='4' fill='#fbdccf' stroke='#eb6834' stroke-width='1.5'/><text x='298.0' y='136.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='normal'>analysed by Praat: chunk ± 50 ms margin</text><line x1='306.0' y1='160.0' x2='306.0' y2='186.0' stroke='#8f8e88' stroke-width='1.2'/><line x1='317.0' y1='160.0' x2='317.0' y2='186.0' stroke='#8f8e88' stroke-width='1.2'/><line x1='328.0' y1='160.0' x2='328.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='339.0' y1='160.0' x2='339.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='350.0' y1='160.0' x2='350.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='361.0' y1='160.0' x2='361.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='372.0' y1='160.0' x2='372.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='383.0' y1='160.0' x2='383.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='394.0' y1='160.0' x2='394.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='405.0' y1='160.0' x2='405.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='416.0' y1='160.0' x2='416.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='427.0' y1='160.0' x2='427.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='438.0' y1='160.0' x2='438.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='449.0' y1='160.0' x2='449.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='460.0' y1='160.0' x2='460.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='471.0' y1='160.0' x2='471.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='482.0' y1='160.0' x2='482.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='493.0' y1='160.0' x2='493.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='504.0' y1='160.0' x2='504.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='515.0' y1='160.0' x2='515.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='526.0' y1='160.0' x2='526.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='537.0' y1='160.0' x2='537.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='548.0' y1='160.0' x2='548.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='559.0' y1='160.0' x2='559.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='570.0' y1='160.0' x2='570.0' y2='186.0' stroke='#2a78d6' stroke-width='2.5'/><line x1='581.0' y1='160.0' x2='581.0' y2='186.0' stroke='#8f8e88' stroke-width='1.2'/><text x='320.0' y='206.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='normal'>frames whose centre lies in the chunk are kept (blue); the others belong to the neighbours</text><text x='60.0' y='250.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>The margin is larger than the analysis window, so the frames near a boundary see the same samples as</text><text x='60.0' y='267.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>on the full signal. Two passes: the first finds the maximum power, the second converts each chunk to</text><text x='60.0' y='284.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>decibels relative to it and quantizes them on 8 bits over a 70 dB range. Only one chunk is in</text><text x='60.0' y='301.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>floating point at a time.</text></svg>
