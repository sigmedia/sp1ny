<svg xmlns='http://www.w3.org/2000/svg' width='900' height='326' viewBox='0 0 900 326' role='img'><title>Block-wise resampling during playback</title><rect width='900' height='326' fill='#fcfcfb'/><text x='24.0' y='30.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Playback: resampling block by block in the audio callback</text><text x='24.0' y='124.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>source</text><text x='24.0' y='139.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>(16 kHz)</text><text x='24.0' y='234.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>played</text><text x='24.0' y='249.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>(48 kHz)</text><line x1='100.0' y1='120.0' x2='100.0' y2='112.0' stroke='#2a78d6' stroke-width='2'/><circle cx='100.0' cy='112.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='196.0' y1='120.0' x2='196.0' y2='92.0' stroke='#2a78d6' stroke-width='2'/><circle cx='196.0' cy='92.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='292.0' y1='120.0' x2='292.0' y2='84.0' stroke='#2a78d6' stroke-width='2'/><circle cx='292.0' cy='84.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='388.0' y1='120.0' x2='388.0' y2='104.0' stroke='#2a78d6' stroke-width='2'/><circle cx='388.0' cy='104.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='484.0' y1='120.0' x2='484.0' y2='132.0' stroke='#2a78d6' stroke-width='2'/><circle cx='484.0' cy='132.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='580.0' y1='120.0' x2='580.0' y2='152.0' stroke='#2a78d6' stroke-width='2'/><circle cx='580.0' cy='152.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='676.0' y1='120.0' x2='676.0' y2='140.0' stroke='#2a78d6' stroke-width='2'/><circle cx='676.0' cy='140.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='772.0' y1='120.0' x2='772.0' y2='116.0' stroke='#2a78d6' stroke-width='2'/><circle cx='772.0' cy='116.0' r='4' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/><line x1='80.0' y1='120.0' x2='792.0' y2='120.0' stroke='#e4e3de' stroke-width='1'/><line x1='80.0' y1='230.0' x2='792.0' y2='230.0' stroke='#e4e3de' stroke-width='1'/><line x1='100.0' y1='230.0' x2='100.0' y2='222.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='132.0' y1='230.0' x2='132.0' y2='215.3' stroke='#2a78d6' stroke-width='1.2'/><line x1='164.0' y1='230.0' x2='164.0' y2='208.7' stroke='#2a78d6' stroke-width='1.2'/><line x1='196.0' y1='230.0' x2='196.0' y2='202.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='228.0' y1='230.0' x2='228.0' y2='199.3' stroke='#2a78d6' stroke-width='1.2'/><line x1='260.0' y1='230.0' x2='260.0' y2='196.7' stroke='#2a78d6' stroke-width='1.2'/><line x1='292.0' y1='230.0' x2='292.0' y2='194.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='324.0' y1='230.0' x2='324.0' y2='200.7' stroke='#eb6834' stroke-width='2'/><line x1='324.0' y1='200.7' x2='324.0' y2='150.0' stroke='#eb6834' stroke-width='1' stroke-dasharray='3 3'/><text x='332.0' y='252.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='normal'>p = 7  →  source position 7 × ρ = 2.33: between samples 2 and 3,</text><text x='332.0' y='267.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='normal'>value = 0.67 · x[2] + 0.33 · x[3]</text><line x1='356.0' y1='230.0' x2='356.0' y2='207.3' stroke='#2a78d6' stroke-width='1.2'/><line x1='388.0' y1='230.0' x2='388.0' y2='214.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='420.0' y1='230.0' x2='420.0' y2='223.3' stroke='#2a78d6' stroke-width='1.2'/><line x1='452.0' y1='230.0' x2='452.0' y2='232.7' stroke='#2a78d6' stroke-width='1.2'/><line x1='484.0' y1='230.0' x2='484.0' y2='242.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='516.0' y1='230.0' x2='516.0' y2='248.7' stroke='#2a78d6' stroke-width='1.2'/><line x1='548.0' y1='230.0' x2='548.0' y2='255.3' stroke='#2a78d6' stroke-width='1.2'/><line x1='580.0' y1='230.0' x2='580.0' y2='262.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='612.0' y1='230.0' x2='612.0' y2='258.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='644.0' y1='230.0' x2='644.0' y2='254.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='676.0' y1='230.0' x2='676.0' y2='250.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='708.0' y1='230.0' x2='708.0' y2='242.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='740.0' y1='230.0' x2='740.0' y2='234.0' stroke='#2a78d6' stroke-width='1.2'/><line x1='772.0' y1='230.0' x2='772.0' y2='226.0' stroke='#2a78d6' stroke-width='1.2'/><text x='80.0' y='296.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>ρ = source rate / played rate. Only the samples of the current block (a few hundred) are computed,</text><text x='80.0' y='313.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>so no resampled copy of the signal is ever stored. Used only when the device rejects the native rate.</text></svg>
