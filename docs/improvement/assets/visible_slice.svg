<svg xmlns='http://www.w3.org/2000/svg' width='900' height='400' viewBox='0 0 900 400' role='img'><title>Visible-slice rendering of the data images</title><rect width='900' height='400' fill='#fcfcfb'/><text x='24.0' y='30.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Data images: only the visible slice (plus a margin) is given to the image item</text><text x='60.0' y='70.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>data: all the frames (never copied)</text><rect x='60.0' y='78.0' width='780.0' height='20.0' rx='3' fill='#e4e3de' stroke='#8f8e88' stroke-width='1.5'/><rect x='370.0' y='74.0' width='200.0' height='28.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><rect x='420.0' y='70.0' width='100.0' height='36.0' rx='4' fill='none' stroke='#eb6834' stroke-width='1.5' stroke-dasharray='5 4'/><text x='470.0' y='124.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>visible range (w frames)</text><text x='370.0' y='140.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='start' font-weight='normal'>slice = visible range ± w/2</text><text x='370.0' y='155.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>image item ← data[s0:s1]  (a view)</text><text x='370.0' y='170.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>transform ← translate(s0, 0) · T</text><text x='60.0' y='212.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>pan inside the slice: nothing to do</text><rect x='60.0' y='220.0' width='780.0' height='20.0' rx='3' fill='#e4e3de' stroke='#8f8e88' stroke-width='1.5'/><rect x='370.0' y='216.0' width='200.0' height='28.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><rect x='450.0' y='212.0' width='100.0' height='36.0' rx='4' fill='none' stroke='#eb6834' stroke-width='1.5' stroke-dasharray='5 4'/><text x='60.0' y='302.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>view leaves the slice (long pan, zoom-out) or slice > 3 × view (zoom-in): new slice</text><rect x='60.0' y='310.0' width='780.0' height='20.0' rx='3' fill='#e4e3de' stroke='#8f8e88' stroke-width='1.5'/><rect x='370.0' y='306.0' width='200.0' height='28.0' rx='4' fill='none' stroke='#2a78d6' stroke-width='1.5' stroke-dasharray='3 3'/><rect x='550.0' y='306.0' width='200.0' height='28.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><rect x='600.0' y='302.0' width='100.0' height='36.0' rx='4' fill='none' stroke='#eb6834' stroke-width='1.5' stroke-dasharray='5 4'/><text x='60.0' y='372.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>The rendering cost is proportional to the slice (at most 3 × the visible frames, then downsampled</text><text x='60.0' y='389.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>to the screen), not to the length of the recording.</text></svg>
