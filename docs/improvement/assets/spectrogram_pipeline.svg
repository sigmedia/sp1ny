<svg xmlns='http://www.w3.org/2000/svg' width='900' height='490' viewBox='0 0 900 490' role='img'><title>Spectrogram extraction pipeline</title><rect width='900' height='490' fill='#fcfcfb'/><text x='24.0' y='30.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Spectrogram: one pass by blocks of frames, then 8-bit quantization</text><text x='24.0' y='70.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>signal (zero-padded by n_fft/2 on each side)</text><rect x='24.0' y='78.0' width='852.0' height='22.0' rx='3' fill='#e4e3de' stroke='#8f8e88' stroke-width='1.5'/><rect x='27.0' y='106.0' width='207.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='130.0' y='119.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>block 0: 128 frames</text><rect x='240.0' y='106.0' width='207.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='343.0' y='119.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>block 1: 128 frames</text><rect x='453.0' y='106.0' width='207.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='556.0' y='119.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>block 2: 128 frames</text><rect x='666.0' y='106.0' width='207.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='769.0' y='119.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>block 3: 128 frames</text><text x='24.0' y='142.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>frame t is centred on sample t·hop; a block needs the samples of its own frames only</text><text x='24.0' y='185.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>thread 1</text><rect x='110.0' y='165.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='175.0' y='186.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>frames (view, no copy)</text><rect x='260.0' y='165.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='325.0' y='186.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>× window</text><line x1='240.0' y1='182.0' x2='258.0' y2='182.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M258.0,182.0 L250.6,185.1 L250.6,178.9 Z' fill='#8f8e88'/><rect x='410.0' y='165.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='475.0' y='186.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>rFFT (n_fft)</text><line x1='390.0' y1='182.0' x2='408.0' y2='182.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M408.0,182.0 L400.6,185.1 L400.6,178.9 Z' fill='#8f8e88'/><rect x='560.0' y='165.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='625.0' y='186.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>|X|  (float32)</text><line x1='540.0' y1='182.0' x2='558.0' y2='182.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M558.0,182.0 L550.6,185.1 L550.6,178.9 Z' fill='#8f8e88'/><line x1='690.0' y1='182.0' x2='728.0' y2='183.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M728.0,183.0 L720.6,185.9 L720.7,179.7 Z' fill='#8f8e88'/><line x1='690.0' y1='182.0' x2='728.0' y2='245.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M728.0,245.0 L721.5,240.3 L726.9,237.1 Z' fill='#8f8e88'/><text x='24.0' y='270.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>thread 2</text><rect x='110.0' y='250.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='175.0' y='271.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>frames (view, no copy)</text><rect x='260.0' y='250.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='325.0' y='271.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>× window</text><line x1='240.0' y1='267.0' x2='258.0' y2='267.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M258.0,267.0 L250.6,270.1 L250.6,263.9 Z' fill='#8f8e88'/><rect x='410.0' y='250.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='475.0' y='271.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>rFFT (n_fft)</text><line x1='390.0' y1='267.0' x2='408.0' y2='267.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M408.0,267.0 L400.6,270.1 L400.6,263.9 Z' fill='#8f8e88'/><rect x='560.0' y='250.0' width='130.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='625.0' y='271.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>|X|  (float32)</text><line x1='540.0' y1='267.0' x2='558.0' y2='267.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M558.0,267.0 L550.6,270.1 L550.6,263.9 Z' fill='#8f8e88'/><line x1='690.0' y1='267.0' x2='728.0' y2='183.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M728.0,183.0 L727.8,191.0 L722.1,188.4 Z' fill='#8f8e88'/><line x1='690.0' y1='267.0' x2='728.0' y2='245.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M728.0,245.0 L723.2,251.4 L720.1,246.0 Z' fill='#8f8e88'/><text x='24.0' y='306.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>(up to 4 threads; numpy releases the GIL during the FFT; each block writes its own rows)</text><rect x='732.0' y='160.0' width='144.0' height='46.0' rx='4' fill='#fbdccf' stroke='#eb6834' stroke-width='1.5'/><text x='804.0' y='179.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>block maximum</text><text x='804.0' y='195.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal'>(all bins)</text><rect x='732.0' y='222.0' width='144.0' height='46.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='804.0' y='241.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>20·log10 |X| of the</text><text x='804.0' y='257.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>kept bins → float16</text><line x1='24.0' y1='320.0' x2='876.0' y2='320.0' stroke='#e4e3de' stroke-width='1'/><text x='24.0' y='345.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='bold'>after the pass</text><rect x='24.0' y='360.0' width='250.0' height='54.0' rx='4' fill='#fbdccf' stroke='#eb6834' stroke-width='1.5'/><text x='149.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>M = max of the block maxima</text><text x='149.0' y='399.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal'>(0 dB reference, as librosa)</text><rect x='314.0' y='360.0' width='300.0' height='54.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='464.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>d = max(a − 20·log10 M, −80) clipped to [L, H]</text><text x='464.0' y='399.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>code = round((d − L) · 255 / (H − L))</text><rect x='654.0' y='360.0' width='222.0' height='54.0' rx='4' fill='#2a78d6' stroke='#2a78d6' stroke-width='1.5'/><text x='765.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#fcfcfb' text-anchor='middle' font-weight='bold'>uint8 spectrogram</text><text x='765.0' y='399.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#fcfcfb' text-anchor='middle' font-weight='normal'>1 byte per kept cell</text><line x1='274.0' y1='387.0' x2='312.0' y2='387.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M312.0,387.0 L304.6,390.1 L304.6,383.9 Z' fill='#8f8e88'/><line x1='614.0' y1='387.0' x2='652.0' y2='387.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M652.0,387.0 L644.6,390.1 L644.6,383.9 Z' fill='#8f8e88'/><text x='24.0' y='448.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>Memory: the float16 buffer (2 bytes per kept cell) and the uint8 result (1 byte) during the extraction,</text><text x='24.0' y='466.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>1 byte per kept cell afterwards; each thread only holds the temporaries of one block (128 × n_fft values).</text></svg>
