<svg xmlns='http://www.w3.org/2000/svg' width='900' height='450' viewBox='0 0 900 450' role='img'><title>Spectrogram extraction pipeline</title><rect width='900' height='450' fill='#fcfcfb'/><text x='24.0' y='30.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Spectrogram: only the visible frames, by blocks</text><text x='24.0' y='62.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>signal</text><rect x='24.0' y='70.0' width='852.0' height='22.0' rx='3' fill='#e4e3de' stroke='#8f8e88' stroke-width='1.5'/><rect x='296.0' y='66.0' width='348.0' height='30.0' rx='4' fill='none' stroke='#eb6834' stroke-width='1.5' stroke-dasharray='5 4'/><text x='470.0' y='62.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>visible range</text><rect x='302.0' y='100.0' width='81.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='342.5' y='113.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>128 frames</text><rect x='387.0' y='100.0' width='81.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='427.5' y='113.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>128 frames</text><rect x='472.0' y='100.0' width='81.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='512.5' y='113.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>128 frames</text><rect x='557.0' y='100.0' width='81.0' height='18.0' rx='3' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='597.5' y='113.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>128 frames</text><text x='24.0' y='138.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>only the frames of the visible range are computed, by blocks</text><text x='24.0' y='179.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>thread 1</text><rect x='90.0' y='158.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='154.0' y='179.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>frames (view, no copy)</text><rect x='235.0' y='158.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='299.0' y='179.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>× window</text><line x1='218.0' y1='175.0' x2='233.0' y2='175.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M233.0,175.0 L225.6,178.1 L225.6,171.9 Z' fill='#8f8e88'/><rect x='380.0' y='158.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='444.0' y='179.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>rFFT (n_fft)</text><line x1='363.0' y1='175.0' x2='378.0' y2='175.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M378.0,175.0 L370.6,178.1 L370.6,171.9 Z' fill='#8f8e88'/><rect x='525.0' y='158.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='589.0' y='179.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>|X|  (float32)</text><line x1='508.0' y1='175.0' x2='523.0' y2='175.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M523.0,175.0 L515.6,178.1 L515.6,171.9 Z' fill='#8f8e88'/><line x1='653.0' y1='175.0' x2='672.0' y2='175.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M672.0,175.0 L664.6,178.1 L664.6,171.9 Z' fill='#8f8e88'/><rect x='674.0' y='158.0' width='202.0' height='34.0' rx='4' fill='#2a78d6' stroke='#2a78d6' stroke-width='1.5'/><text x='775.0' y='179.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#fcfcfb' text-anchor='middle' font-weight='normal'>8-bit codes of the block</text><text x='24.0' y='241.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='normal'>thread 2</text><rect x='90.0' y='220.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='154.0' y='241.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>frames (view, no copy)</text><rect x='235.0' y='220.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='299.0' y='241.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>× window</text><line x1='218.0' y1='237.0' x2='233.0' y2='237.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M233.0,237.0 L225.6,240.1 L225.6,233.9 Z' fill='#8f8e88'/><rect x='380.0' y='220.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='444.0' y='241.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>rFFT (n_fft)</text><line x1='363.0' y1='237.0' x2='378.0' y2='237.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M378.0,237.0 L370.6,240.1 L370.6,233.9 Z' fill='#8f8e88'/><rect x='525.0' y='220.0' width='128.0' height='34.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='589.0' y='241.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>|X|  (float32)</text><line x1='508.0' y1='237.0' x2='523.0' y2='237.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M523.0,237.0 L515.6,240.1 L515.6,233.9 Z' fill='#8f8e88'/><line x1='653.0' y1='237.0' x2='672.0' y2='237.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M672.0,237.0 L664.6,240.1 L664.6,233.9 Z' fill='#8f8e88'/><rect x='674.0' y='220.0' width='202.0' height='34.0' rx='4' fill='#2a78d6' stroke='#2a78d6' stroke-width='1.5'/><text x='775.0' y='241.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#fcfcfb' text-anchor='middle' font-weight='normal'>8-bit codes of the block</text><text x='24.0' y='272.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>(up to 4 threads; numpy releases the GIL during the FFT; each block writes its own rows)</text><line x1='24.0' y1='290.0' x2='876.0' y2='290.0' stroke='#e4e3de' stroke-width='1'/><text x='24.0' y='314.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='bold'>quantization of a block</text><rect x='24.0' y='328.0' width='330.0' height='54.0' rx='4' fill='#fbdccf' stroke='#eb6834' stroke-width='1.5'/><text x='189.0' y='350.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>R = peak(|x|) · sum(window) / 2</text><text x='189.0' y='367.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#52514e' text-anchor='middle' font-weight='normal'>a sine at the peak of the whole signal: stable colours</text><rect x='394.0' y='328.0' width='482.0' height='54.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='635.0' y='350.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>d = clip(20 · log10(|X| / R), −80, 0)</text><text x='635.0' y='367.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>code = round((d + 80) · 255 / 80)</text><line x1='354.0' y1='355.0' x2='392.0' y2='355.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M392.0,355.0 L384.6,358.1 L384.6,351.9 Z' fill='#8f8e88'/><text x='24.0' y='412.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>Memory: 1 byte per kept cell of the visible range; each thread only holds the temporaries of one block</text><text x='24.0' y='430.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>(128 × n_fft values). The display range only selects which codes map to the ends of the colormap.</text></svg>
