<svg xmlns='http://www.w3.org/2000/svg' width='900' height='230' viewBox='0 0 900 230' role='img'><title>Overlap-save convolution of a block of the equalizer</title><rect width='900' height='230' fill='#fcfcfb'/><text x='24.0' y='30.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Equalizer: overlap-save on the last 8192 samples</text><text x='24.0' y='64.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>buffer (8192 samples)</text><rect x='24.0' y='72.0' width='760.0' height='28.0' rx='3' fill='#e4e3de' stroke='#8f8e88' stroke-width='1.5'/><rect x='784.0' y='72.0' width='92.0' height='28.0' rx='3' fill='#2a78d6' stroke='#2a78d6' stroke-width='1.5'/><text x='830.0' y='91.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#fcfcfb' text-anchor='middle' font-weight='normal'>block</text><rect x='120.0' y='130.0' width='170.0' height='36.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='205.0' y='153.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>FFT(buffer)</text><rect x='350.0' y='130.0' width='170.0' height='36.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='435.0' y='153.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>× G  (filter)</text><line x1='292.0' y1='148.0' x2='348.0' y2='148.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M348.0,148.0 L340.6,151.1 L340.6,144.9 Z' fill='#8f8e88'/><rect x='580.0' y='130.0' width='170.0' height='36.0' rx='4' fill='#cfe0f6' stroke='#2a78d6' stroke-width='1.5'/><text x='665.0' y='153.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#0b0b0b' text-anchor='middle' font-weight='normal'>inverse FFT</text><line x1='522.0' y1='148.0' x2='578.0' y2='148.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M578.0,148.0 L570.6,151.1 L570.6,144.9 Z' fill='#8f8e88'/><line x1='750.0' y1='148.0' x2='784.0' y2='148.0' stroke='#8f8e88' stroke-width='1.5'/><path d='M784.0,148.0 L776.6,151.1 L776.6,144.9 Z' fill='#8f8e88'/><rect x='786.0' y='130.0' width='90.0' height='36.0' rx='4' fill='#2a78d6' stroke='#2a78d6' stroke-width='1.5'/><text x='831.0' y='153.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#fcfcfb' text-anchor='middle' font-weight='normal'>output</text><text x='24.0' y='200.0' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#52514e' text-anchor='start' font-weight='normal'>Only the last samples are valid: the others wrap around. A change of filter fades over one block.</text></svg>
