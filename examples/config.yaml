# Configuration of Sp1NY, with every setting at its default value.
#
# Copy it to spiny/config.yaml in your configuration directory (~/.config/spiny/config.yaml on Linux), or give it with
# --config, and keep only what you want to change.
#
# Colours are anything Qt understands: "#rrggbb", "#aarrggbb" (with transparency) or a name such as "red".
# Quote them: an unquoted # starts a comment in YAML.
# Shortcuts are written as in Qt ("Ctrl+Shift+P", "Space", "F5", ...); an empty value removes a shortcut.
# The wheel can zoom, pan or do nothing (none); two fingers on a trackpad are a wheel with two directions.

theme: light
shortcuts:
  open_file: Ctrl+O
  quit: Ctrl+Q
  play_pause: Space
  stop: Esc
  go_to_start: Home
  go_to_end: End
  rewind: Left
  forward: Right
  loop: L
  speed_down: '['
  speed_up: ']'
  mute: M
  zoom_in: Ctrl+=
  zoom_out: Ctrl+-
  zoom_fit: Ctrl+0
  follow: F
  switch_theme: Ctrl+T
  delete_annotation: Delete
wheel:
  wheel_up_down: zoom
  wheel_left_right: pan
  shift_wheel_up_down: pan
  shift_wheel_left_right: pan
themes:
